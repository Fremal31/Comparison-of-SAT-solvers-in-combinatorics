[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["src"]

markers = [
    "integration: marks tests as integration tests requiring solver binaries (deselect with -m 'not integration')"
]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
explicit_package_bases = true
strict = true

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src"]
include = ["src/**/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]